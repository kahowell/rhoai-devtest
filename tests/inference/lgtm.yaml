apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: redhat-ods-monitoring
  labels:
    app: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      name: lgtm
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: docker.io/grafana/otel-lgtm
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: data
      restartPolicy: Always
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: redhat-ods-monitoring
  labels:
    app: lgtm
spec:
  selector:
    app: lgtm
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
